# TOKIWA JSON access log for nginx (read by `tokiwa agent run --nginx <file>`, dataset "nginx.access").
#
# Drop this file into a directory that is included in the `http {}` context
# (the official nginx image includes /etc/nginx/conf.d/*.conf there), or copy the two directives into it.
# Requires nginx >= 1.11.8 for `escape=json`.
#
# Every value is quoted; the agent converts numbers itself. Keys are nginx variable names without "$":
# `http_*` become request headers, `sent_http_*` response headers (see backend/src/tokiwa/sensors/nginx.py).
#
# Do NOT add $http_cookie, $http_authorization or request bodies here. The agent masks them anyway, but
# secrets that never reach the log cannot leak from it.
#
# The browser hint headers (sec-fetch-*, sec-ch-ua, accept-language) are kept on purpose: their absence on
# otherwise "browser-like" traffic is one of the client fingerprints used for AI-agent attribution.

log_format tokiwa_json escape=json
  '{'
    '"time_iso8601":"$time_iso8601",'
    '"msec":"$msec",'
    '"request_id":"$request_id",'
    '"remote_addr":"$remote_addr",'
    '"remote_port":"$remote_port",'
    '"server_addr":"$server_addr",'
    '"server_port":"$server_port",'
    '"scheme":"$scheme",'
    '"host":"$host",'
    '"request_method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"server_protocol":"$server_protocol",'
    '"status":"$status",'
    '"body_bytes_sent":"$body_bytes_sent",'
    '"bytes_sent":"$bytes_sent",'
    '"request_length":"$request_length",'
    '"request_time":"$request_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"content_type":"$content_type",'
    '"content_length":"$content_length",'
    '"sent_http_content_type":"$sent_http_content_type",'
    '"http_user_agent":"$http_user_agent",'
    '"http_referer":"$http_referer",'
    '"http_x_forwarded_for":"$http_x_forwarded_for",'
    '"http_accept":"$http_accept",'
    '"http_accept_language":"$http_accept_language",'
    '"http_accept_encoding":"$http_accept_encoding",'
    '"http_origin":"$http_origin",'
    '"http_x_requested_with":"$http_x_requested_with",'
    '"http_sec_fetch_site":"$http_sec_fetch_site",'
    '"http_sec_fetch_mode":"$http_sec_fetch_mode",'
    '"http_sec_fetch_dest":"$http_sec_fetch_dest",'
    '"http_sec_ch_ua":"$http_sec_ch_ua",'
    '"http_upgrade_insecure_requests":"$http_upgrade_insecure_requests"'
  '}';

# One JSON object per line. Point the agent at this path (TOKIWA_AGENT__NGINX_JSON_LOGS='["/var/log/nginx/tokiwa-access.json"]').
access_log /var/log/nginx/tokiwa-access.json tokiwa_json;
