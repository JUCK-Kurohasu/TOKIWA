# Optional nginx front for the lab victim (compose profile "agent"). The JSON access-log format and the
# access_log directive come from lab/nginx/tokiwa-json.conf (sensors), mounted next to this file in conf.d.
server {
    listen 8081;
    server_name _;

    location / {
        proxy_pass http://victim:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
