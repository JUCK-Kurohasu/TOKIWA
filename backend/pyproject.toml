[project]
name = "tokiwa"
version = "0.1.0"
description = "TOKIWA - LLM-driven SIEM/XDR for detecting and defending against generative-AI-driven cyber attacks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "JUCK (juck-kurohasu)" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "psutil>=6.0",
    "anthropic>=0.60",
    "feedparser>=6.0",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]

[project.scripts]
tokiwa = "tokiwa.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokiwa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "S101",   # assert in tests
    "S311",   # non-crypto random is fine for jitter/simulation
    "RUF001", "RUF002", "RUF003",  # Japanese full-width chars in strings/comments
    "B008",   # FastAPI Depends in defaults
    "E501",   # line length is handled by ruff format; long strings/docstrings are fine
    "UP046",  # typing.Generic is fine (pydantic generic models)
    "S105",   # false positives on token_type/prefix constants
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
