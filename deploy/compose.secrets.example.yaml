# Optional override: pass secrets to the containers as files (Compose secrets) instead of environment variables,
# so they do not show up in `docker inspect`, `docker compose config` or /proc/<pid>/environ (audits #71 #108 #110).
#
#   cp deploy/compose.secrets.example.yaml deploy/compose.secrets.yaml   # keep only the blocks you use
#   install -d -m 700 secrets                                            # at the repository root (git-ignored)
#   (umask 077 && "${EDITOR:-vi}" secrets/anthropic_api_key)              # one value per file, no quotes
#   sudo chown 10001:10001 secrets/anthropic_api_key secrets/database_url secrets/gate_token
#   sudo chown 999:999 secrets/postgres_password    # the uid of "postgres" in the image, see docs/deploy.md §5
#   docker compose -f deploy/compose.yaml -f deploy/compose.secrets.yaml --env-file .env up -d
#
# Compose bind-mounts file secrets read-only at /run/secrets/<name> and cannot change their owner or mode, so each
# file must be readable by the container's user (TOKIWA runs as uid 10001). Remove the same values from .env:
# TOKIWA refuses to start when both X and X_FILE are set.
services:
  tokiwa:
    environment:
      TOKIWA_LLM__ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      TOKIWA_DATABASE__URL_FILE: /run/secrets/database_url # postgresql+asyncpg://tokiwa:<password>@postgres:5432/tokiwa
    secrets:
      - anthropic_api_key
      - database_url

  postgres:
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password # read by the official image's entrypoint
    secrets:
      - postgres_password

  gate:
    environment:
      TOKIWA_GATE__TOKEN_FILE: /run/secrets/gate_token # re-read when it changes (overwrite it in place)
    secrets:
      - gate_token

secrets:
  anthropic_api_key:
    file: ../secrets/anthropic_api_key
  database_url:
    file: ../secrets/database_url
  postgres_password:
    file: ../secrets/postgres_password
  gate_token:
    file: ../secrets/gate_token
