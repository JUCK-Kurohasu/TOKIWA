# TOKIWA — production-leaning Compose stack (Docker Engine 25+, Compose v2.24+).
#
#   cp .env.example .env                                         # at the repository root, then edit
#   docker compose -f deploy/compose.yaml --env-file .env up -d --build
#   open http://localhost:8788  ->  create the first admin on /setup
#
# Optional profiles (enable with --profile <name> or COMPOSE_PROFILES=<a>,<b> in .env):
#   postgres  PostgreSQL instead of the default SQLite file (also set TOKIWA_DATABASE__URL, see .env.example)
#   gate      TOKIWA Gate reverse proxy in front of an upstream app (needs an ingest token)
#
# Secrets as files instead of environment variables: deploy/compose.secrets.example.yaml (docs/deploy.md §5).
# The lab stack (victim app + simulator) lives in lab/compose.yaml. Details: docs/deploy.md.
name: tokiwa

# Shared by tokiwa and gate. No env_file here: the whole .env (JWT key, LLM / intel keys, DB password) goes to the
# tokiwa server only; the gate, which faces attack traffic, gets the few variables it reads (audit #71).
x-tokiwa-image: &tokiwa-image
  image: ${TOKIWA_IMAGE:-tokiwa:local}
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512 # threads count too; far above what the server or the gate use
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  tokiwa:
    <<: *tokiwa-image
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["serve"]
    # Every TOKIWA_* setting (and ANTHROPIC_API_KEY) from .env. Keep secrets out of it where you can: *_FILE + Compose
    # secrets (deploy/compose.secrets.example.yaml) keep them out of `docker inspect` (audit #108 / #110).
    env_file:
      - path: ../.env
        required: false
    ports:
      # Bound to loopback by default: put a TLS reverse proxy in front (docs/deploy.md) or set TOKIWA_BIND.
      - "${TOKIWA_BIND:-127.0.0.1}:${TOKIWA_PORT:-8788}:8788"
    volumes:
      - tokiwa-data:/data
      # Optional static config file (the image sets TOKIWA_CONFIG=/etc/tokiwa/tokiwa.yaml and ships an empty one).
      # Long syntax so a missing host file fails the start instead of being created as a directory:
      # - type: bind
      #   source: ./tokiwa.yaml
      #   target: /etc/tokiwa/tokiwa.yaml
      #   read_only: true
      #   bind:
      #     create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
        required: false # only when the postgres profile is enabled
    stop_grace_period: 30s

  postgres:
    image: postgres:18.6-trixie@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    profiles: ["postgres"]
    restart: unless-stopped
    # Hardening (audit #109). The official entrypoint starts as root, creates / chmods / chowns the data and socket
    # directories (CHOWN, DAC_OVERRIDE, FOWNER) and switches to the postgres user with gosu (SETUID, SETGID); the
    # server itself needs none. List taken from docker-entrypoint.sh (docker-library/postgres, 18/trixie).
    # TODO(verify): start-up with these capabilities was not run here. read_only is left off: it needs tmpfs for
    # the socket directory and whatever else the image writes, which was not verified.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tokiwa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-tokiwa}
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory of /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    shm_size: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Not published on the host: only the tokiwa service reaches it over the compose network.

  gate:
    <<: *tokiwa-image
    profiles: ["gate"]
    command: ["gate", "run"]
    environment:
      TOKIWA_GATE__SERVER_URL: http://tokiwa:8788
      TOKIWA_GATE__LISTEN_HOST: 0.0.0.0
      TOKIWA_GATE__LISTEN_PORT: "8080"
      TOKIWA_GATE__UPSTREAM: ${TOKIWA_GATE__UPSTREAM:-http://host.docker.internal:3000}
      TOKIWA_HEALTHCHECK_URL: http://127.0.0.1:8080/__tokiwa/health
      # From .env, only what the gate reads (a key without a value is taken from .env, and left out when unset there).
      # Prefer TOKIWA_GATE__TOKEN_FILE with a Compose secret over TOKIWA_GATE__INGEST_TOKEN (compose.secrets.example.yaml).
      TOKIWA_ENV: ${TOKIWA_ENV:-prod} # the image's default; a value-less key might unset it
      TOKIWA_LOG_LEVEL:
      TOKIWA_GATE__INGEST_TOKEN:
      TOKIWA_GATE__TOKEN_FILE:
      TOKIWA_GATE__SENSOR_ID:
      TOKIWA_GATE__CAPTURE_BODY_BYTES:
      TOKIWA_GATE__BATCH_SIZE:
      TOKIWA_GATE__FLUSH_INTERVAL_SECONDS:
      TOKIWA_GATE__POLICY_REFRESH_SECONDS:
      TOKIWA_GATE__TRUST_FORWARDED_FOR:
      TOKIWA_GATE__MAX_REQUEST_HEADERS:
      TOKIWA_GATE__FORWARD_CLIENT_HEADERS:
      TOKIWA_GATE__TARPIT_MAX_CONCURRENT:
      TOKIWA_GATE__TARPIT_MAX_PER_CLIENT:
      TOKIWA_LLM__REDACTION__ENABLED: # the gate masks captured headers / bodies with these
      TOKIWA_LLM__REDACTION__SENSITIVE_HEADERS:
      TOKIWA_LLM__REDACTION__MASK_EMAILS:
      TOKIWA_LLM__REDACTION__MASK_IPS:
      TOKIWA_LLM__REDACTION__MAX_FIELD_CHARS:
      TOKIWA_DECEPTION__CANARY_HEADER:
    tmpfs:
      - /tmp
      - /data # the gate keeps no state; avoids an anonymous volume for the image's VOLUME
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TOKIWA_GATE_BIND:-0.0.0.0}:${TOKIWA_GATE_PORT:-8080}:8080"
    depends_on:
      tokiwa:
        condition: service_healthy

volumes:
  tokiwa-data:
  postgres-data:
