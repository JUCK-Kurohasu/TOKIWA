# TOKIWA CI: backend (ruff + pytest), frontend (typecheck + lint + build), Docker image (build + smoke test),
# and infra lint (actionlint / hadolint / shellcheck). Needs no secrets: the LLM is always the mock provider.
# Third-party actions are pinned to commit SHAs (version in the trailing comment).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TOKIWA_LLM__PROVIDER: mock
  FORCE_COLOR: "1"

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.11.32"
          python-version: "3.12"
          working-directory: backend
      - name: Install dependencies (uv.lock must be up to date)
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github src tests ../scripts ../deploy
      - name: ruff format
        run: uv run ruff format --check src tests ../scripts ../deploy
      - name: pytest
        run: uv run pytest
      - name: Demo seed payload matches the Event schema
        run: uv run python ../scripts/seed_demo.py --validate
      - name: mypy (informational until existing errors are fixed)
        run: uv run mypy src
        continue-on-error: true

  frontend:
    name: frontend (typecheck + lint + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Unit tests (vitest)
        run: npm test -- --passWithNoTests

  docker:
    name: docker image (build + smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build deploy/Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          tags: tokiwa:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/docker-smoke.sh tokiwa:ci

  infra-lint:
    name: infra lint (actionlint, hadolint, shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 hadolint - < deploy/Dockerfile
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 scripts/*.sh deploy/*.sh
