# Dependabot version updates (audit #104). Security updates are enabled in the repository settings and are not
# delayed by the cooldown below. Ecosystem names and options: GitHub docs "Dependabot options reference".
#
# cooldown: a new release is proposed only after it has been public for 7 days - most malicious package versions
# are found and pulled within that window. Lower it per ecosystem if that is too slow.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # Base images: deploy/Dockerfile names them in ARG defaults (FROM ${NODE_IMAGE} ...).
  # TODO(verify): whether Dependabot updates image references in ARG defaults; if it does not, bump them by hand
  # together with their @sha256 digests (docs/deploy.md §10).
  - package-ecosystem: docker
    directories: ["/deploy", "/lab/victim"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker-compose
    directories: ["/deploy", "/lab"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
