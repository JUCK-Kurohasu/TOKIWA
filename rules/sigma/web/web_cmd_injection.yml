title: OS Command Injection Attempt
id: 758f38f5-68ce-4d10-ae2a-ef2c765d1f03
status: experimental
description: |
  Detects shell metacharacters (; | || && ` $( ) followed by typical reconnaissance or reverse-shell
  commands (id, whoami, uname, cat /etc/passwd, curl/wget http, nc -e, bash -i, /bin/sh) in the query string or
  request body.
references:
  - https://owasp.org/www-community/attacks/Command_Injection
author: TOKIWA
date: 2026-10-22
tags:
  - attack.execution
  - attack.t1059.004
  - attack.initial_access
  - attack.t1190
logsource:
  category: webserver
  product: tokiwa
detection:
  selection_query:
    cs-uri-query|re|i: '(;|\|\|?|&&|`|\$\()\s*(id|whoami|uname(\s+-a)?|cat\s+/etc/(passwd|shadow)|ls\s+-la|ifconfig|ipconfig|(wget|curl)\s+(-\S+\s+)*https?://|nc(at)?\s+(-\S+\s+)*-e|bash\s+-i|/bin/(ba)?sh)\b'
  selection_body:
    request_body|re|i: '(;|\|\|?|&&|`|\$\()\s*(id|whoami|uname(\s+-a)?|cat\s+/etc/(passwd|shadow)|ls\s+-la|ifconfig|ipconfig|(wget|curl)\s+(-\S+\s+)*https?://|nc(at)?\s+(-\S+\s+)*-e|bash\s+-i|/bin/(ba)?sh)\b'
  condition: 1 of selection_*
falsepositives:
  - Web shells / admin tools that legitimately run commands (should not be internet-facing)
  - Documentation or chat content that quotes shell commands in request bodies
level: high
